name: s-clair
x-app: &app
  image: s-clair-tools:local
  build:
    context: .
    target: tools
    network: ${BUILD_NETWORK:-default}
  user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
  working_dir: /workspace
  volumes:
    - .:/workspace
  init: true
services:
  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Create .env from .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?Create .env from .env.example}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    command: [pnpm, --filter, '@s-clair/api', dev]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      start_period: 30s
      retries: 20
  web:
    <<: *app
    command: [pnpm, --filter, '@s-clair/web', dev]
    ports:
      - '127.0.0.1:${WEB_PORT:-4200}:4200'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4200').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      start_period: 30s
      retries: 20
volumes:
  database:
