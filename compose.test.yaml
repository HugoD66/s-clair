services:
  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: sclair_test
    volumes:
      - check_database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test -d sclair_test]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    image: s-clair-api:test
    build:
      context: .
      target: api
      network: ${BUILD_NETWORK:-default}
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://test:test-only@db:5432/sclair_test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
  web:
    image: s-clair-web:test
    build:
      context: .
      target: web
      network: ${BUILD_NETWORK:-default}
    init: true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4200').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
  runner:
    image: s-clair-tests:local
    build:
      context: .
      target: tests
      network: ${BUILD_NETWORK:-default}
    init: true
    environment:
      DATABASE_URL: postgresql://test:test-only@db:5432/sclair_test
      BASE_URL: http://web:4200
      CI: 'true'
    profiles: [tests]

volumes:
  check_database:
